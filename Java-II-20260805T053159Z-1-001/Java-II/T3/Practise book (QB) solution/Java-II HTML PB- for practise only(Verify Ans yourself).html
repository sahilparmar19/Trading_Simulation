<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Programming using Java-II PRACTICE BOOK (SEM-II-EVEN_2026-CE RELATED BRANCHES) — Practice Quiz</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--border:#334155;--accent:#6366f1;
  --accent2:#22d3ee;--text:#e2e8f0;--muted:#94a3b8;--success:#22c55e;
  --danger:#ef4444;--warn:#f59e0b;--radius:12px;
}
body.light{
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:24px 32px;}
.header h1{font-size:1.6rem;font-weight:800;color:#fff;}
.header p{color:rgba(255,255,255,.75);font-size:.9rem;margin-top:4px;}
.toolbar{display:flex;gap:12px;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.85;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-outline.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-sm{padding:5px 12px;font-size:.78rem;}
select{background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer;}
.main{display:flex;min-height:calc(100vh - 160px);}
.sidebar{width:260px;min-width:200px;background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;}
.sidebar h3{font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin-bottom:12px;}
.unit-btn{display:block;width:100%;text-align:left;padding:9px 14px;border-radius:8px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:.88rem;margin-bottom:4px;transition:.15s;}
.unit-btn:hover,.unit-btn.active{background:var(--accent);color:#fff;}
.progress-ring{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:.8rem;}
.progress-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--accent2);border-radius:3px;transition:.3s;}
.content{flex:1;padding:24px;overflow-y:auto;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;transition:.2s;}
.q-card:hover{border-color:var(--accent);}
.q-meta{font-size:.75rem;color:var(--muted);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap;}
.q-num{font-weight:700;color:var(--accent);font-size:1rem;}
.q-text{line-height:1.6;font-size:.95rem;white-space:pre-wrap;margin:10px 0 10px;}
.q-image{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:0 0 14px;border:1px solid var(--border);object-fit:contain;background:var(--bg);}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt{padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;font-size:.88rem;transition:.2s;display:flex;align-items:center;gap:10px;}
.opt:hover{border-color:var(--accent);background:rgba(99,102,241,.1);}
.opt.selected{border-color:var(--accent);background:rgba(99,102,241,.15);}
.opt.correct{border-color:var(--success)!important;background:rgba(34,197,94,.15)!important;}
.opt.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.12)!important;}
.opt-label{font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--border);flex-shrink:0;font-size:.8rem;}
.feedback{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.88rem;font-weight:600;}
.feedback.correct{background:rgba(34,197,94,.15);color:var(--success);}
.feedback.wrong{background:rgba(239,68,68,.12);color:var(--danger);}
.marks-badge{font-size:.72rem;padding:2px 8px;border-radius:20px;background:rgba(99,102,241,.2);color:var(--accent);font-weight:600;}
.bookmark-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);transition:.15s;}
.bookmark-btn.bookmarked{color:var(--warn);}
.score-panel{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius);padding:20px;margin-bottom:24px;color:#fff;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.score-big{font-size:2.5rem;font-weight:900;line-height:1;}
.score-label{font-size:.8rem;opacity:.8;}
.theory-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.theory-card h4{color:var(--warn);font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.empty{text-align:center;padding:60px;color:var(--muted);}
.instructions-box{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:14px 18px;font-size:.85rem;color:var(--warn);margin-bottom:20px;}
/* ── Solution Styles ───────────────────── */
.solution-box{margin-top:14px;border:1px solid var(--accent);border-radius:8px;overflow:hidden;}
.solution-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(99,102,241,.15);cursor:pointer;font-weight:700;font-size:.85rem;color:var(--accent);user-select:none;}
.solution-header:hover{background:rgba(99,102,241,.25);}
.solution-body{display:none;padding:14px;background:rgba(0,0,0,.3);}
.solution-body.open{display:block;}
.solution-body pre{background:rgba(0,0,0,.4);padding:14px;border-radius:6px;font-size:.82rem;line-height:1.55;overflow-x:auto;color:#a5f3fc;white-space:pre-wrap;word-wrap:break-word;font-family:'Fira Code','Cascadia Code','Consolas',monospace;}
/* ── Explanation Styles ────────────────── */
.explanation-box{margin-top:10px;padding:12px 16px;border-radius:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);font-size:.88rem;line-height:1.55;color:var(--warn);}
@media(max-width:700px){.sidebar{display:none}.options{grid-template-columns:1fr}}
</style>
</head>

<script>
const ALL_QUESTIONS = [{"sr_no": "1", "unit": "1", "topic": "", "text": "Output of following Java program?\nclass Base {\n    public void Print() {\n        System.out.println(\"Base\");\n    }         \n}\n class Derived extends Base {    \n    public void Print() {\n        System.out.println(\"Derived\"); }\n}\n class Main{\n    public static void DoPrint( Base o ) {\n        o.Print(); }\n    public static void main(String[] args) {\n        Base x = new Base();\n        Base y = new Derived();\n        Derived z = new Derived();\n        DoPrint(x);\n        DoPrint(y);\n        DoPrint(z);\n    } }", "marks": 1.0, "options": {"A": "Base\nDerived\nDerived", "B": "Base\nBase\nDerived", "C": "Base\nDerived\nBase", "D": "Compiler Error"}, "answer": "A", "type": "mcq"}, {"sr_no": "2", "unit": "1", "topic": "", "text": "class Base {\n  public void Print() { System.out.println(\"Base\");\n  } }\n  class Derived extends Base { public void Print() {\n  System.out.println(\"Derived\");\n  } }\n  class Main{\n  public static void DoPrint( Derived o ) { o.Print(); }\n  public static void main(String[] args) { Base x = new Base();\n  Base y = new Derived(); Derived z = new Derived(); \n  DoPrint((Derived)x);\n  DoPrint((Derived)y); \n  DoPrint(z); }}", "marks": 1.0, "options": {"A": "Base\nDerived\nDerived", "B": "Base\nBase\nDerived", "C": "Runtime Error", "D": "Compiler Error"}, "answer": "C", "type": "mcq"}, {"sr_no": "3", "unit": "1", "topic": "", "text": "Will this code run successfully? If yes, what will be the output?\nclass A {\n  private int x = 50;\n  void m1() {\n    System.out.println(x);\n  }\n}\nclass B extends A {\n}\nclass Test {\n  public static void main(String[] args) {\n    A a = new B();\n    a.m1();\n  }  }", "marks": 1.0, "options": {"A": "30", "B": "40", "C": "50", "D": "Compiler error"}, "answer": "C", "type": "mcq"}, {"sr_no": "4", "unit": "1", "topic": "", "text": "Predict the output of following program. Note that foo() is public in base and private in derived.\nclass Base {\n    public void foo() { System.out.println(\"Base\"); }\n}\nclass Derived extends Base {\n    private void foo() { System.out.println(\"Derived\"); } \n}\npublic class Main {\n    public static void main(String args[]) {\n        Base b = new Derived();\n        b.foo();\n    }\n}", "marks": 1.0, "options": {"A": "Base", "B": "Derived", "C": "Compiler Error", "D": "Runtime Error"}, "answer": "C", "type": "mcq"}, {"sr_no": "5", "unit": "1", "topic": "", "text": "What will be the output of the following code?\nclass A {\n   int x = 20;\n}\nclass B extends A {\n   int x = 30;\n}\nclass Test {\n   public static void main(String[] args) {\n      B b = new B();\n      System.out.print(b.x+\",\");\n      A a = new A();\n      System.out.print(a.x+\",\");\n      A a2 = new B();\n      System.out.print(a2.x+\",\");   } }", "marks": 1.0, "options": {"A": "20,20,30,", "B": "30,20,20,", "C": "30,30,30,", "D": "30,20,30,"}, "answer": "B", "type": "mcq"}, {"sr_no": "6", "unit": "1", "topic": "", "text": "class Base {\n    public static void show() {\n       System.out.println(\"Base::show() called\");\n    }\n}\nclass Derived extends Base {\n    public static void show() {\n       System.out.println(\"Derived::show() called\");\n    }  }\nclass Main {\n    public static void main(String[] args) {\n        Base b = new Derived();\n        b.show();\n    } }", "marks": 1.0, "options": {"A": "Base::show() called", "B": "Derived::show() called", "C": "Compiler Error", "D": "None of these"}, "answer": "A", "type": "mcq"}, {"sr_no": "7", "unit": "1", "topic": "", "text": "class A {\n void m1(String x){\n  System.out.print(\"One \");  \n }  }\nclass B extends A { \n public void m1(String x){\n  System.out.print(\"Two \");\n  super.m1(null);\n }  }\nclass Test{\npublic static void main(String[] args){\n A a = new B();\n a.m1(null);\n  } }", "marks": 1.0, "options": {"A": "One Two", "B": "Two One", "C": "null null", "D": "Compiler error"}, "answer": "B", "type": "mcq"}, {"sr_no": "11", "unit": "1", "topic": "", "text": "Which of these keywords are used to define an abstract class?", "marks": 1.0, "options": {"A": "abst", "B": "abstract", "C": "Abstract", "D": "abstract class"}, "answer": "B", "type": "mcq"}, {"sr_no": "12", "unit": "1", "topic": "", "text": "What is the correct statement in java abstract class? \nA) In abstract class every method must be abstract \nB) In Abstract class we have to define atlease one abstract method. \nC) In abstract class if we do not define any abstract method then it will not give any error. \nD) In abstract class every method is public, static and abstract", "marks": 1.0, "options": {"A": "A & B", "B": "only D", "C": "only A", "D": "Only C"}, "answer": "D", "type": "mcq"}, {"sr_no": "13", "unit": "1", "topic": "", "text": "What is the output of the following code?\nabstract class LJU\n{\n  LJU()  {\n    System.out.print(\"Hi \");\n  }\n}\nclass LJIET extends LJU\n{\n  LJIET()   {\n    System.out.print(\"Bye\");\n  }\n}\nclass AbstractClassTesting\n{\n  public static void main(String[] args)\n  {\n    LJU lj = new LJIET();\n  }\n}", "marks": 1.0, "options": {"A": "Hi", "B": "Hi Bye", "C": "Bye", "D": "Bye Hi"}, "answer": "B", "type": "mcq"}, {"sr_no": "14", "unit": "1", "topic": "", "text": "What is the output of the following code?\nabstract class Book\n{\n  abstract void show();\n}\nabstract class Fiction extends Book\n{\n  abstract void print();\n}\nclass BookStore extends Fiction\n{\n  void show()\n  {\n    System.out.println(\"Book Store Show\");\n  }\n  void print()\n  {\n    System.out.println(\"Book Store Print\");\n  }\n}\nclass AbstractClassTesting4\n{\n  public static void main(String[] args)\n  {\n    BookStore bs = new Fiction();\n    bs.show();    }     }", "marks": 1.0, "options": {"A": "Book Store Show", "B": "No Output", "C": "Compile time error", "D": "Run time error"}, "answer": "C", "type": "mcq"}, {"sr_no": "15", "unit": "1", "topic": "", "text": "What will be the output of the following code? \nabstract class Book {\n    abstract void show(); }\n    abstract class Fiction extends Book { abstract void print();\n        void show()   {\n            System.out.println(\"Book Store Show\");\n            }\n    }\n    class BookStore extends Fiction { \n     void show()   {\n     System.out.println(\"Book Store Print\");\n      }\n      void print()   {\n      System.out.println(\"Book Store Show\");\n      }\n    }\n    class AbstractClassTesting4 {\n    public static void main(String[] args)\n    {\n    Fiction bs = new BookStore(); \n     bs.show();   \n     }    }", "marks": 1.0, "options": {"A": "Book Store Show", "B": "Book Store Print", "C": "Compile time error", "D": "Run time error"}, "answer": "B", "type": "mcq"}, {"sr_no": "19", "unit": "1", "topic": "", "text": "All Interface variables are ___ by default in Java.", "marks": 1.0, "options": {"A": "public Only", "B": "final Only", "C": "public, static and final", "D": "None"}, "answer": "C", "type": "mcq"}, {"sr_no": "20", "unit": "1", "topic": "", "text": "All Interface method are ___ by default in Java.", "marks": 1.0, "options": {"A": "public", "B": "abstact", "C": "public and abstact", "D": "final"}, "answer": "C", "type": "mcq"}, {"sr_no": "21", "unit": "1", "topic": "", "text": "A Class implementing an Interface can use ____ access modifier before the implemented methods.", "marks": 1.0, "options": {"A": "public", "B": "private", "C": "protected", "D": "default"}, "answer": "A", "type": "mcq"}, {"sr_no": "22", "unit": "1", "topic": "", "text": "Can you call it a full-fledged inheritance of using ABSTRACT classes and INTERFACES in Java?", "marks": 1.0, "options": {"A": "NO", "B": "YES", "C": "There is no such concept of absract class in JAVA", "D": "None of these"}, "answer": "A", "type": "mcq"}, {"sr_no": "23", "unit": "1", "topic": "", "text": "Which two classes use the Shape class correctly?", "marks": 1.0, "options": {"A": "public class Circle implements Shape \n   {\n    private int radius;\n   }", "B": "public abstract class Circle extends Shape \n   {\n    private int radius;\n   }", "C": "public class Circle extends Shape \n   {\n   private int radius;\n   public void draw();\n   }", "D": "public abstract class Circle implements Shape \n   {\n    private int radius;\n    public void draw();\n   }"}, "answer": "B", "type": "mcq"}, {"sr_no": "24", "unit": "1", "topic": "", "text": "Which is the keyword used to implement interface in Java?", "marks": 1.0, "options": {"A": "extends", "B": "implements", "C": "instanceof", "D": "None of these"}, "answer": "B", "type": "mcq"}, {"sr_no": "25", "unit": "1", "topic": "", "text": "Choose a correct statement about Java Interfaces?", "marks": 1.0, "options": {"A": "Interface contains only abstract methods by default.", "B": "A Java class can implement multiple interfaces", "C": "An Interface can extend or inherit another Interface.", "D": "All the mention"}, "answer": "D", "type": "mcq"}, {"sr_no": "26", "unit": "1", "topic": "", "text": "What will be the output of the following code?\ninterface Book\n{\n  char type='C'; \n}\npublic class InterfaceTest3\n{\n  public static void main(String[] args)\n  {\n    System.out.println(new Book().type);\n  }\n}", "marks": 1.0, "options": {"A": "C", "B": "No Output", "C": "run time error", "D": "Compiler error"}, "answer": "D", "type": "mcq"}, {"sr_no": "27", "unit": "1", "topic": "", "text": "Which of the following is correct?\n\nA: All methods in an interface are by default public. \nB: Abstract methods have to be either protected or public. They can not be private", "marks": 1.0, "options": {"A": "Both are incorrect", "B": "Both are Correct", "C": "only A", "D": "Only B"}, "answer": "B", "type": "mcq"}, {"sr_no": "28", "unit": "1", "topic": "", "text": "What is the output of the following code?\n\nclass King {\n    public static void main(String[] args) {\n        King k = new King();\n        Elephant e = k.new Elephant();\n        System.out.print(e.step2(2, 3));\n    }\n    interface Queen {\n        float step2(int low, int high);\n    }\n    interface Pawn {\n        float step3(int a, int b, int c);\n    }\n    abstract class Knight implements Queen, Pawn {\n    }\n    class Elephant implements Queen {\n        public float step2(int x, int y) {\n            return 2;\n        }\n    }\n}", "marks": 1.0, "options": {"A": "compile time error", "B": "run time error", "C": "2.0", "D": "2"}, "answer": "C", "type": "mcq"}, {"sr_no": "29", "unit": "1", "topic": "", "text": "class King {\n  public static void main(String[] args) { \n     King k = new King();\n     Elephant e = k.new Elephant(); \n     System.out.print(e.step2(3, 2));\n}\ninterface Queen {\nfloat step2(int low, int high);\n}\ninterface Pawn {\nfloat step3(int a, int b, int c);\n}\nabstract class Knight implements Queen, Pawn {\n}\nclass Elephant implements Queen\n { \n      public float step2(int x, int y) {\n      return 1;\n }  \n }  \n}", "marks": 1.0, "options": {"A": "compile time error", "B": "run time error", "C": "1.0", "D": "1"}, "answer": "C", "type": "mcq"}, {"sr_no": "30", "unit": "1", "topic": "", "text": "What will be the output of the following code?\ninterface Bus\n{\n  void move();\n}\nclass ElectricBus implements Bus\n{\n  public void move()\n  {\n    System.out.println(\"Implemented  move() method.\");\n  } \n}\nclass InterfaceTest1\n{\n  public static void main(String[] args)\n  {\n    new ElectricBus().move();\n  }\n}", "marks": 1.0, "options": {"A": "No output", "B": "Implemented  move() method.", "C": "run time error", "D": "Compiler error"}, "answer": "B", "type": "mcq"}, {"sr_no": "31", "unit": "1", "topic": "", "text": "What will be the output of the following code?\ninterface LJU1 {\n     void exam();\n}\nabstract class LJIET1 implements LJU1{\n           public void exam(){\n                         System.out.println(\"LJIET Exam\");\n            }\n}\nclass FY extends LJIET1{\n                 public vo thods to demonstrate their functionality.", "marks": 3.0, "type": "theory"}, {"sr_no": "132", "unit": "3", "topic": "", "text": "Write a program to handle ArrayIndexOutofBoundsException using try-catch-finally and throw.", "marks": 3.0, "type": "theory"}, {"sr_no": "133", "unit": "3", "topic": "", "text": "Write a program to handle NullPointerException.", "marks": 4.0, "type": "theory"}, {"sr_no": "134", "unit": "3", "topic": "", "text": "Write an application that searches through its command-line argument. If first command line argument is found zero then display error message.", "marks": 4.0, "type": "theory"}, {"sr_no": "135", "unit": "3", "topic": "", "text": "Write an application that searches through its command-line argument. If sum of first and second  command line argument is found 10 then display error message.", "marks": 4.0, "type": "theory"}, {"sr_no": "136", "unit": "3", "topic": "", "text": "Write an application that searches through its command-line argument. If any of command line argument is found nagative then display error message.", "marks": 5.0, "type": "theory"}, {"sr_no": "140", "unit": "3", "topic": "", "text": "Write a program to handle InterruptedException, IllegalArgumentException using try-cat-finally and throw", "marks": 3.0, "type": "theory"}, {"sr_no": "141", "unit": "3", "topic": "", "text": "Write a method for computing x ^ y  by doing repetitive multiplication. x and y are of type integer and are to be given as command line arguments. Raise and handle exception(s) for invalid values of x and y. Also define method main.", "marks": 4.0, "type": "theory"}, {"sr_no": "142", "unit": "3", "topic": "", "text": "Write an application that searches through its command-line argument. If an argument is found that does not begin with an upper case letter, display error message and terminate.", "marks": 4.0, "type": "theory"}, {"sr_no": "143", "unit": "3", "topic": "", "text": "Write a program to create user define exception MyException. Define urces, total number of occupied resources and total number of inaccessible resources. The exception to be raised and handled if total number of occupied resources exceeds total number of free resources. \nThe handler marks status of all inaccessible resources as free. Accept initial status values from command line arguments and initialize the array. Raise and handle user defined exception if invalid status value given", "marks": 5.0, "type": "theory"}, {"sr_no": "148", "unit": "3", "topic": "", "text": "Write a complete program to accept N integer numbers from the command line. Raise and\nhandle exceptions for following cases :\n- when a number is –ve\n- when a number is evenly divisible by 10\n- when a number is greater than 1000 and less than 2000\n- when a number is greater than 7000\nSkip the number if an exception is raised for it, otherwise add it to find total sum", "marks": 5.0, "type": "theory"}, {"sr_no": "149", "unit": "3", "topic": "", "text": "Declare a class called coordinate to represent 3 dimensional Cartesian coordinates( x, y and z).\nDefine following methods:\n- constructor\n- display, to print values of members\n- add_coordinates, to add three such coordinate objects to produce a resultant\ncoordinate object. Generate and handle exception if x, y and z coordinates of the result are zero. \n- main, to show use of above methods.", "marks": 5.0, "type": "theory"}, {"sr_no": "150", "unit": "1,2,3", "topic": "", "text": "In LJ Innovation 2024, We have number of projects and from it we selected project “SmartHub” for incubation center. Their idea is to make smart home automation devices and sell out to the end users. For this they require a Java Software so Student, please help them to automate their smart home using Java. All the best for it. \nRequirements: \nDevice Interface : This defines behavior of all devices.\nMethods are : \n-\tvoid turnOn(): turns the device on , \n-\tvoid turnoff(): turns the device off , \n-\tboolean getStatus() : returns the status of device whether it is on/off \n\nAbstract class : HomeAutomation \nThis provide functionality to manage the devices. \n\n-\tabstract void addDevice(Device device): Adds a new device to the system.\n-\tabstract void removeDevice(Device device): Removes a device from the system.\n-\tabstract void checkDeviceStatus(Device device) throws DeviceNotFoundException: Checks the status of a specific device.\n-\tCreate DeviceNotFoundException : If user enters the device which is not there then it throws DeviceNotFoundException() [This is unchecked exception]\n-\tabstract void turnOffAllDevices(): Turns off all devices in the system.\n\nLight class implements Device: \nMethods: \n-\tvoid turnOn() : Turns the light On  \n-\tvoid turnOff() : Turns the light Off\n-\tboolean getStatus(): Returns the current status of the light\n\nSecurityCamera class  implements Device: \nMethods: \n-\tvoid turnOn() : Activates the Security Camera  \n-\tvoid turnOff() : Deactivates the Security Camera\n-\tboolean getStatus(): Returns the current status of the Security Camera \n\nClass SmartHub\nThis class contains the main() method and extends the HomeAutomation class. \nImplement all abstract methods of HomeAutomation class over here in SmartHub class. \n\nCreate a method handleUserChoice(int choice) : that throws InvaildChoiceException \nThis is must be a checked exception. \n\nAsk user to do the following again and again until user enters 8 : \n \n-\tChoice 1 : to Add Light \n-\tChoice 2 : to Add SecurityCamera \n-\tChoice 3 : To turn Light On [If it is off ] / Off [If it is On]\n-\tChoice 4 :  To turn Security Camera Activate [If it is Deactivate] / Deactivate[If it is Activate]\n-\tChocie 5 : To Check Status of Light : Throw DeviceNotFoundException if Light is not added in Home \n-\tChoice 6: TO Check Status of SecurityCamera :  Throw DeviceNotFoundException & Handle it if SecurityCamera is not added in Home\n-\tChoice 7 : To TurnOffAll Devices \n-\tChoice 8 : To Come out from the Choices \n-\tIf user enter < 1 && >8 then throw InvalidChoiceException & Handle it \n-\tAt Last use finally to print Thank you for choosing Smart Hub", "marks": 1, "type": "theory"}, {"sr_no": "151", "unit": "1,2,3", "topic": "", "text": "Food Ordering System\nYou are tasked with developing a food ordering system in Java. The system should allow users to select any one food item from a menu, specify the quantity of that item, place their order, and make a payment. Write a Java program that meets the following requirements:\n\n1. Define an abstract class called `FoodItem` with the following attributes and methods:\n   - Attributes: - `name` (protected String). `price` (protected double) \n   - Methods:   - `display()`: an abstract method that displays the details of the food item.\n2. Define an interface called `Orderable` with the following methods:\n   - `placeOrder(int quantity)`: a method that takes an integer `quantity` as a parameter and only prints a message indicating the order details.\n   - `cancelOrder()`: a method that only prints a cancellation message.\n3. Implement two concrete classes, `Pizza` and `Shake`, which inherit from the `FoodItem` class and implement the `Orderable` interface. \nEach class should have additional attributes and methods as follows:\n- `Pizza` class:\n     - Attributes:  - `size` (private String): representing the size of the pizza.\n     - Methods:   - Implement the abstract `display()` method to display the pizza's details.\n- `Shake` class:\n     - Attributes:   - `size` (private String): representing the size of the shake.\n     - Methods:     - Implement the abstract `display()` method to display the shake's details.\n\n4. Define a custom exception class called `InvalidMenuItemException` that extends the `Exception` class. The `InvalidMenuItemException` should have a constructor that accepts a String parameter to display an error message.\n\n5. In the `FoodOrderingSystem` class's `main` method, perform all the following steps:\n   - Create an array of `FoodItem` called `menu` with a capacity of 4.\n   - Initialize the `menu` array with four different food items, including pizzas and shakes, each with different name, price and size as follows:Fooditem\tName\tPrice\tSize\nPizza\tMargherita\t349\tRegular\nPizza\tPepperoni\t449\tLarge\nShake\tChocolate\t149\tRegular\nShake\tStrawberry\t249\tLarge\n\n   - Display the menu by iterating over the `menu` array and calling the `display()` method for each item.\n   - Prompt the user to enter the item number they wish to order.\n   - Validate the user input:- If the item number is invalid (less than 1 or greater than the menu length), throw an `InvalidMenuItemException` with the message \"Invalid item number selected!\". \n   - If the item number is valid, then prompt the user to enter the quantity to order.\n   - If no exceptions occur, retrieve the selected item from the `menu` array based on the user's input, cast it to `Orderable`, and call the `placeOrder()` method with the specified quantity.\n   - Prompt the user to make a payment by entering a payment method (1 for cash, 2 for credit card).\n   - Implement the `payment()` method with a switch case to handle the payment scenarios:\n\nFor Cash payment: Show total bill amount and ask user to enter the same or more cash_amount. If cash_amount > = bill amount, then payment is successful, display a payment confirmation message. Else throw a custom exception called `PaymentFailedException` with the message \"Cash Payment failed!\".\n\nFor Creditcard payment: Show total bill amount and ask user to enter the same or more amount. If credit_amount > =bill amount and Creditcard= 12345678, then only payment is successful, display a payment confirmation message. Else throw a custom exception called `PaymentFailedException` with the message \"Creditcard Payment failed!\".\n     \nHandle any exceptions that may occur during the payment process using appropriate exception handling mechanisms.\n\nValidation: (You may use below Test cases to validate the functionality of your program before submitting code)\n1. Valid item number and quantity:\n   - Select an item from the menu.\n   - Enter a valid quantity.\n   - Make a successful payment.\n\n2. Invalid item number:\n   - Enter an invalid item number (less than 1 or greater than the menu length).\n   - Verify that the program throws the `InvalidMenuItemException`.\n\n3. Payment failure:\n   - Select an item from the menu and Enter a valid quantity.\n   - Choose any payment flow such that it results in a payment failure.\n   - Verify that the program throws the `PaymentFailedException`", "marks": 1, "type": "theory"}, {"sr_no": "152", "unit": "1,2,3", "topic": "", "text": "Airline Ticket Booking System\nYou are tasked with building a simple airline ticket management application that allows a user to:\n1.Book a ticket\n2.Edit an existing ticket\n3. Cancel a ticket\n4.Display ticket details\n5.Exit the application\nThe system must allow only one active (non-cancelled) ticket at a time. If a user tries to book another ticket without cancelling the previous one, the system should prevent it. Additionally, the system should validate passenger details and handle invalid actions gracefully using custom unchecked exceptions.\nSystem Components\n1. Interface: Bookable\nThis interface should define behaviors related to ticket actions.\n•\tMethods:\n•\tvoid bookTicket();\n•\tvoid cancelTicket();\n•\tvoid editTicket(String newName, int newAge, String newDestination);\n2. Abstract Class: Ticket\nRepresents a general template for any type of ticket.\n•\tAttributes: \n•\tprotected String passengerName\n•\tprotected int age\n•\tprotected String destination\n•\tprotected boolean isCancelled = false\n•\tMethod:\n•\tabstract void displayTicket();\n3. Class: AirlineTicket\nRepresents an airline ticket. Extends Ticket and implements Bookable.\n•\tConstructor:\n•\t public AirlineTicket(String passengerName, int age, String destination)\n•\tImplemented Methods:\n•\tvoid bookTicket()\n•\tvoid cancelTicket()\n•\tvoid editTicket(String newName, int newAge, String newDestination)\n•\tvoid displayTicket()\n4. Custom Unchecked Exceptions\ni.\tInvalidPassengerException\n•\tThrown when:\n- Age is not within valid range (1–120)\n- Name is null or empty\n- Destination is null or empty\n- Age input is not a valid integer\nii.\tTicketAlreadyExistsException\n•\tThrown when trying to book a new ticket while an active ticket already exists.\niii.\tTicketNotFoundException\n•\tThrown when trying to edit, cancel, or display a ticket that was never booked or has been cancelled.\n5. Main Class: AirlineBookingSystem\nThis class handles user interaction and menu.\nResponsibilities:\n•\t Maintain one AirlineTicket object\n•\t Display menu repeatedly\n•\t Take user input using Scanner\n•\t Perform actions and handle exceptions\nValidation Rules                                                                       \nField\t                                                Condition\t                                         Exception to be Thrown\nName\t                                            Null or empty\t                                      InvalidPassengerException\nAge\t                                             <= 0 or > 120\t                                      InvalidPassengerException\nAge (input)\t                         Non-numeric input                               \t      InvalidPassengerException\nDestination\t                             Null or empty\t                                      InvalidPassengerException\nBooking\t                        Already active ticket exists\t                     TicketAlreadyExistsException\nEdit\t                                            No active ticket                                   \t     TicketNotFoundException\nCancel\t                                            No active ticket\t                                     TicketNotFoundException\nDisplay\t                                            Ticket does not exist                    \t     TicketNotFoundException", "marks": 1, "type": "theory"}, {"sr_no": "200", "unit": "4", "topic": "", "text": "Write an application that creates and starts three threads. Each thread is instantiated from the\nsame class. It executes a loop with 10 iterations. Each iteration displays string \"HELLO\",\nsleeps for 300 milliseconds. The application waits for all the threads to complete & displays \nthe message \"Good Bye...\"", "marks": 3.0, "type": "theory"}, {"sr_no": "201", "unit": "4", "topic": "", "text": "Write a program to create a child thread to print integer numbers 1 to 10", "marks": 3.0, "type": "theory"}, {"sr_no": "202", "unit": "4", "topic": "", "text": "Write a program to create two threads, one thread will check whether given number is prime or not and second thread will print prime numbers between 0 to 100", "marks": 3.0, "type": "theory"}, {"sr_no": "203", "unit": "4", "topic": "", "text": "It's IPL 2023 time. In this process of IPL-23 there is a thread called Bowler. This Bowler is going to create two threads with name – “Yorker” and “googly”.\nWrite a java program to perform following task with each thread. \nTask 1 : if the thread name is \"yorker\" then it should print \"SIXER\" \nTask 2 : if the thread name is \"googly\" then it should print \"WICKET\" \nMake sure first thread bowl must be yorker. When execution of first thread is completed then and only then second bowl googly should work. Hint: Here Bowler is a Thread Class. and It must have execution of SIXER AND WICKET.  Both yorker and googly must be from Bowler Thread Only. Give name IPL to the class of Main method.", "marks": 5.0, "type": "theory"}, {"sr_no": "204", "unit": "4", "topic": "", "text": "Write an application that executes two threads. One thread displays \"Good Morning\" every \n1000 milliseconds & another thread displays \"Good Afternoon\" every 3000 milliseconds for 10 times.. \nCreate the threads by implementing the Runnable interface.", "marks": 5.0, "type": "theory"}, {"sr_no": "205", "unit": "4", "topic": "", "text": "Write a program to create two threads, one thread will print odd numbers and second thread will print even numbers between 1 to 100 numbers", "marks": 4.0, "type": "theory"}, {"sr_no": "206", "unit": "4", "topic": "", "text": "Write a complete multi-threaded program to meet following requirements:\no Two threads of same type are to be instantiated in the method main.\no Each thread acts as a producer as well as a consumer.\no A shared buffer can store only one integer information along with the source & \ndestination of the information at a time.\no The information produced is to be consumed by appropriate consumer.\no Both producers produce information for both consumers.\no Each thread produces 5 information.", "marks": 5.0, "type": "theory"}, {"sr_no": "207", "unit": "4", "topic": "", "text": "Create PaymentThread class by extending Thread and Make a program to count payments of 10 tickets each of 100 rs. Display total using main thread.", "marks": 5.0, "type": "theory"}, {"sr_no": "208", "unit": "4", "topic": "", "text": "Write a multithreaded program to print all odd positive numbers in ascending order up to n, where n is a positive integer number given as a command line argument. Instantiate requited number of threads, where each thread except the last, examines next 50 numbers and the last thread examines remaining numbers up to n", "marks": 5.0, "type": "theory"}, {"sr_no": "209", "unit": "4", "topic": "", "text": "Write an application that read limit from user and executes two threads. One thread displays total of first n even numbers & another thread displays total of first n odd numbers. Create the threads by implementing the Runnable interface", "marks": 4.0, "type": "theory"}, {"sr_no": "210", "unit": "4", "topic": "", "text": "Write a program to create two thread one display alphabet from a to z and other will display numbers from 1 to 100", "marks": 3.0, "type": "theory"}, {"sr_no": "211", "unit": "4", "topic": "", "text": "write a program that demonstrates the prodecer consumer concept in detail.", "marks": 4.0, "type": "theory"}, {"sr_no": "212", "unit": "4", "topic": "", "text": "Explain the concept of Syncronization by taking suitable example.", "marks": 4.0, "type": "theory"}, {"sr_no": "213", "unit": "4", "topic": "", "text": "Write a complete multi-threaded program to meet following requirements:\n- Read matrix [A] m x n\n- Create m number of threads\n- Each thread computes summation of elements of one row, i.e. ith row of the matrix is processed by ith thread. Where 0 <= i< m.\n- Print the results", "marks": 4.0, "type": "theory"}, {"sr_no": "214", "unit": "4", "topic": "", "text": "Create a program for class PVR having Total_seats as instance variable.Create  method for seat booking.Create two threads which try to book seat of PVR screen1 (common object). Use concept of synchronization.", "marks": 6.0, "type": "theory"}, {"sr_no": "215", "unit": "4", "topic": "", "text": "Make caller thread by extending thread class which calls synchronized receiver method available in receiver class. Make two threads of Caller  and display message \"Ringing\" and thread name  according to thread. Thread name must be Caller1 and Caller2.", "marks": 6.0, "type": "theory"}, {"sr_no": "216", "unit": "4", "topic": "", "text": "Implement a Prime Number Finder\nWrite a Java program to implement a prime number finder that checks if a given number is prime or not in a separate thread. The program should use the join() method to wait for all the threads to finish, and the isAlive() method to check if a thread is still running.\nTo solve this problem, you can create a prime number finder thread that implements the Runnable interface and checks if a given number is prime or not. You can then create multiple instances of the prime number finder thread and start them using separate threads. The main thread can use the join() method to wait for all the threads to finish, and the isAlive() method to check if a thread is still running.", "marks": 5.0, "type": "theory"}, {"sr_no": "217", "unit": "4", "topic": "", "text": "Problem Statement: Implement a Bank Account\n\nWrite a Java program to implement a bank account that allows multiple threads to deposit and withdraw money from the same account. The problem requires synchronization between the threads to prevent race conditions and ensure that the balance is accurate.\nTo solve this problem, you can create a BankAccount class that has a balance variable and synchronized methods for depositing and withdrawing money. You can then create multiple threads that use the deposit and withdraw methods to modify the account balance.", "marks": 5.0, "type": "theory"}, {"sr_no": "218", "unit": "4", "topic": "", "text": "You’re organizing a mini “Car Race” to see which car completes 5 laps first. You’ll write a Java program that launches two Car threads. Each thread prints its lap number, pauses briefly to simulate driving time, and then finishes. The main thread starts both cars, renames them to custom labels (“Car-A” and “Car-B”), waits for them to finish, and reports their status.", "marks": 5.0, "type": "theory"}, {"sr_no": "265", "unit": "5", "topic": "", "text": "Write a program in which create two ArrayList. Add odd numbers between 1 to 10 in one arraylist and even numbers between 1 to 10 in another arraylist. Now merge these two ArrayList and sort them in descending order. At last print this sorted ArrayList.", "marks": 2.0, "type": "theory"}, {"sr_no": "266", "unit": "5", "topic": "", "text": "Write a Java program to create a new array list, add some colors (string) and print out the collection", "marks": 3.0, "type": "theory"}, {"sr_no": "267", "unit": "5", "topic": "", "text": "Write a Java program that creates an ArrayList<Student> to store a name and marks of 3 students. Then sort the ArrayList by student marks in descending order. Then print arraylist using iterator. Add these details of 3 Students in arraylist in given sequence: \nDevarsh (18.5 marks), Viraj (20.5 marks) and Nidhi (17.5 marks)\n\nDesired Output:\nName=Viraj, Marks=20.5\nName=Devarsh, Marks=18.5\nName=Nidhi, Marks=17.5", "marks": 3.0, "type": "theory"}, {"sr_no": "268", "unit": "5", "topic": "", "text": "Write a Java program to remove duplicates from an ArrayList as per given input and output. Take main class 'Exam'. Create ArrayList: [1, 2, 3, 4, 4, 5, 6, 7, 8, 9, 6, 9, 1, 1, 10] in main method then you need to implement another method named 'removeDuplicate' that takes an ArrayList as an argument , removes all duplicates and returns an ArrayList without duplicates. At end print that Arraylist from main method. (No need to use Scannner)\nOutput of your code should be:-   [2, 3, 5, 7, 8, 10]", "marks": 3.0, "type": "theory"}, {"sr_no": "269", "unit": "5", "topic": "", "text": "Remove Duplicates from an ArrayList\nWrite a Java program to remove duplicates from an ArrayList. You need to implement a function that takes an ArrayList as input and returns an ArrayList with duplicates removed.", "marks": 4.0, "type": "theory"}, {"sr_no": "270", "unit": "5", "topic": "", "text": "Merge two sorted ArrayLists\nWrite a Java program to merge two sorted ArrayLists into a single sorted ArrayList. You need to implement a function that takes two sorted ArrayLists as input and returns a single sorted ArrayList containing all the elements.", "marks": 4.0, "type": "theory"}, {"sr_no": "271", "unit": "5", "topic": "", "text": "Write a Java program to copy one array list into another. & sort the second arraylist & search an element in a array list", "marks": 5.0, "type": "theory"}, {"sr_no": "272", "unit": "5", "topic": "", "text": "Problem Statement: Employee Management System\nImplement an employee management system in Java using ArrayList and a class. The system should have the following functionalities:\n\nAdd an employee to the system\nRemove an employee from the system\nUpdate an employee's details\nDisplay all employees in the system\nTo implement this system, you can create an Employee class with attributes such as name, age, salary, etc. Then, you can create an ArrayList to store all the employees. You can then implement functions to add, remove, update and display employees.", "marks": 5.0, "type": "theory"}, {"sr_no": "273", "unit": "5", "topic": "", "text": "Write a Java program that creates an ArrayList to store a list of students and their grades. The program should provide the following functionality:\nAdd a student: The program should prompt the user for a student name and their grade, and add the student to the ArrayList.\nRemove a student: The program should prompt the user for a student name and remove the corresponding entry from the ArrayList.\nSearch for a student: The program should prompt the user for a student name and output their corresponding grade. If the student name is not found in the ArrayList, the program should output an error message.\nSort students by name: The program should sort the ArrayList by student name in ascending order.\nSort students by grade: The program should sort the ArrayList by student grade in descending order.\nTo accomplish these tasks, you can use the following Collections class methods:\naddAll(collection, elements): Adds all elements from one collection to another. sort(list): Sorts the elements in a list in natural order.\nsort(list, comparator): Sorts the elements in a list using a custom comparator. reverse(list): Reverses the order of the elements in a list.\nYou can also use the following ArrayList methods:\nadd(element): Adds an element to the end of the ArrayList.\nremove(element): Removes the first occurrence of an element from the ArrayList. get(index): Returns the element at the specified index in the ArrayList. size(): Returns the number of elements in the ArrayList.", "marks": 6.0, "type": "theory"}, {"sr_no": "274", "unit": "5", "topic": "", "text": "Problem Statement: Library Management System\nYou are required to design a library management system in Java using ArrayList. The system should have the following classes:\nBook - This class should contain the following attributes: bookId, bookName, author, and quantity. It should also have a method to display book details.\nUser - This class should contain the following attributes: userId, userName, and booksIssued. It should also have methods to display user details and to issue/return a book.\nLibrary - This class should contain an ArrayList to store all the books and an ArrayList to store all the users. It should have methods to add/remove books and users, to display all books/users, to issue/return a book, and to display all books issued by a particular user.", "marks": 7.0, "type": "theory"}, {"sr_no": "275", "unit": "5", "topic": "", "text": "Write a Java program to insert the specified element at the specified position in the linked list.", "marks": 3.0, "type": "theory"}, {"sr_no": "276", "unit": "5", "topic": "", "text": "Write a Java program to get the first and last occurrence of the specified elements in a linked list.", "marks": 3.0, "type": "theory"}, {"sr_no": "277", "unit": "5", "topic": "", "text": "Write a Java program to clone an linked list to another linked list.", "marks": 3.0, "type": "theory"}, {"sr_no": "278", "unit": "5", "topic": "", "text": "Write a Java program to append the specified element to the end of a linked list & Write a Java program to iterate through all elements in a linked list.", "marks": 4.0, "type": "theory"}, {"sr_no": "279", "unit": "5", "topic": "", "text": "Problem Statement: Implement a Phone Book\nWrite a Java program to implement a phone book using an ArrayList and a LinkedList. The phone book should allow users to add, delete, and search for contacts by name or phone number.\nTo solve this problem, you can create a Contact class that stores the name and phone number of each contact. You can then use an ArrayList to store the contacts and a LinkedList to store the indices of the contacts sorted by name.", "marks": 7.0, "type": "theory"}, {"sr_no": "280", "unit": "5", "topic": "", "text": "I have an Induction machine manufacturing company. My Manager wants to analyze some data of the induction machines of our manufacturing unit. \nWhat I have: List of machine's price. Note: each price is in Double. \nWrite a java program that contains list of various machine's price. & do the following tasks. \nTask 1 - Create a list of 5 machine's price. [10000.0,55000.0,80000.0,25000.0,55000.0]\nTask 2 - Find the maximum price from the list. \nTask 3 - sort the list.", "marks": 5.0, "type": "theory"}, {"sr_no": "281", "unit": "5", "topic": "", "text": "Write a program that contains Stack of 3 items. First insert 3 items in stack. Then do pop operation 2 times. and print the stack.", "marks": 4.0, "type": "theory"}, {"sr_no": "282", "unit": "5", "topic": "", "text": "Problem Statement: Balanced Parentheses\nGiven a string containing only parentheses, determine if it is balanced. A string is considered balanced if every opening parenthesis has a corresponding closing parenthesis, and they are properly nested.\nYou need to implement a function that takes a string as input and returns true if the string is balanced and false otherwise.\nHINT: To solve this problem, you can use a stack to keep track of the opening parentheses and pop them off the stack when a closing parenthesis is encountered. If at any point the stack is empty when a closing parenthesis is encountered or if the top of the stack doesn't match the current closing parenthesis, then the string is not balanced.", "marks": 5.0, "type": "theory"}, {"sr_no": "283", "unit": "5", "topic": "", "text": "Write a Java program to sort a stack of Student objects by their GPA. You need to implement a function that takes a stack of Student objects as input and returns a new stack with the Students sorted in descending order of their GPA.\n\nTo solve this problem, you can create a Student class with attributes such as name, id, and GPA. You can then create a stack of Student objects and implement a function to sort the stack by their GPA.", "marks": 5.0, "type": "theory"}, {"sr_no": "284", "unit": "5", "topic": "", "text": "Scenario: Build MemeViewer, an app for Gen Z meme-lovers. New memes get stacked on top; users always see the freshest one first. \nYour Task \nIn a single file MemeViewer.java, manage a Stack<String> of meme titles and provide operations to: Post a new meme. View (pop) the latest meme. Peek at the next meme without removing it. Check how many memes are unread. Determine whether the feed is empty. Each operation should print a clear, concise message.", "marks": 5.0, "type": "theory"}, {"sr_no": "285", "unit": "4,5", "topic": "", "text": "Create a Java program for a Quiz game consisting of 5 Multiple Choice Questions (MCQs) with 3 participants. Each participant will be represented by the \"Participant\" class, which will have attributes such as \"name,\" \"age,\" and \"contactNumber\".\n\nTo ensure the correctness of the contact number, implement a validation check. If a participant enters a contact number that is not 10 digits long or does not start with '9', display a message stating \"Wrong number\" and prompt the participant to enter the correct contact number. This validation check should continue until the participant enters a valid 10-digit contact number starting with '9'.\n\nCreate objects of the \"Participant\" class and store them in an ArrayList. This ArrayList will hold all the participant objects participating in the quiz.\n\nUse a Stack data structure to store the correct answers to all 5 MCQs. Each answer should be represented as a character in the stack. This stack will serve as the reference for evaluating the participants' answers. The correct answer sequence is as follows: A, B , A , D , C.\n\nCreate a thread for each participant using Java's threading mechanism. Each thread will represent an individual participant . The participant with the lowest age should be given the chance to answer all 5 questions first using scanner class. At a time only one participant can give answer of Questions.\n\nDuring the quiz, the participant's answers should be stored in an ArrayList. This ArrayList will hold the participant's submitted answers.\n\nAfter all participants have submitted their answers, calculate and display each participant's score. The score should be calculated by comparing each participant's submitted answers (ArrayList) with the correct answers (Stack). Award 1 point for each correct answer and calculate the total score for each participant out of 5.\n\nFinally, declare the winner based on the participant with the highest score. In case of tie, younger participant will be declared as winner.\n\nBelow is the list of 5 Questions which is asked in Quiz.\nQ.1. National bird of INDIA..(A) Peacock (B) Sparrow (C) Duck (D) Owl\nQ.2  Independence year of INDIA..(A) 1955 (B) 1947 (C) 1999 (D) 1929\nQ.3  Gandhi Jayanti is on......(A) 2nd Oct (B) 5th Oct (C) 9th Oct (D) 7th Oct\nQ.4  Count of states in INDIA..(A) 17 (B) 21 (C) 25 (D) 28\nQ.5  how many continents are there in the world..(A) 5 (B) 6 (C) 7 (D) 8\nAnswers: A, B , A , D , C", "marks": 1, "type": "theory"}, {"sr_no": "286", "unit": "4,5", "topic": "", "text": "Filename: ConsProd.java\nYou are tasked with implementing a multi-threaded program in Java that simulates the Consumer Producer problem. In this problem, you have a shared buffer between a consumer and a producer. The producer generates data and puts it into the buffer, while the consumer retrieves data from the buffer. \n\nShared Buffer: Implement a SharedBuffer class.  This class represents the shared resource between the producer and consumer threads. It should support operations for putting data into the buffer (one at a time by producer) and retrieving data from the buffer (one at a time by consumer). It has a value(int) field and isReady(boolean) field indicating whether the value is ready to be consumed or not. The produce() method sets the value and notifies the consumer, while the consume() method consumes the value and notifies the producer.\n\nProducer: Create a Producer thread class that generates data items and puts them into the buffer. It repeatedly produces (total 5) values and sleeps for 1 second between each production. The producer should wait if the buffer is full.\n\nConsumer: Create a Consumer thread class that retrieves data items from the buffer. It repeatedly consumes the produced value (total 5) and sleeps for 1 second between each consumption.The consumer should wait if the buffer is empty.\n\nMain Class (ConsProd): This is the entry point of the program. Create an object of the SharedBuffer class and two threads - one for the producer and one for the consumer. Then start both threads to achieve goal.\nSample output: (assume above mentioned delay between each production and each consumption)\n\nProduced: 1\nConsumed: 1\nProduced: 2\nConsumed: 2\nProduced: 3\nConsumed: 3\nProduced: 4\nConsumed: 4\nProduced: 5\nConsumed: 5\n\nProperly do use of synchronization in methods of the SharedBuffer class to ensure thread safety, and  wait() and notify() methods for coordinating between the producer and consumer threads.", "marks": 1, "type": "theory"}, {"sr_no": "287", "unit": "1", "topic": "", "text": "SnackApp:\nA small café takes 5 online snack orders each day. Two kitchen assistants work in parallel to prepare these orders. Each assistant continuously takes the next available order from the shared queue until there are no orders left, then stops. After they finish, the manager wants:\n1. The total number of prepared orders.\n2. A list of those orders sorted alphabetically by student name.\nRequirements\n1. Multithreaded Order Preparation\nClass OrderProcessor implements Runnable\n- Constructor: accepts a shared Vector<Order> queue, a shared Vector<Order> doneList, and the assistant’s name.\n- run():\n  • While the queue is not empty:\n    – Remove the first Order from the queue.\n    – Simulate preparation by Thread.sleep(150).\n    – Add the processed Order to doneList.\n    – Print:\n      [<name>] Prepared order <orderId> for <studentName>\nmain() in SnackApp.java:\n- Create a Vector<Order> queue and add exactly 5 sample orders.\n- Create an empty Vector<Order> doneList.\n- Start two threads “Chef-A” and “Chef-B”, each running an OrderProcessor.\n- Use join() to wait for both threads to finish.\n- Print:\n  Total orders prepared: <doneList.size()>\n2. Sorted Daily Report \n• Move all orders from doneList into a LinkedList<Order> report.\n• Sort report by student name using:\n• Print:\n  Daily Report:\n  1. <studentName> – Order <orderId>\n  2. …\n3. Class & File Details\n• Order class (in same file SnackApp.java):\n  - Fields: int orderId; String studentName; String itemName;\n  - Constructor and getters.\n  - toString() returns \"<orderId>:<studentName>:<itemName>\".\n• All code in one file named SnackApp.java.\n• Use clear names and brief comments.", "marks": 1, "type": "theory"}, {"sr_no": "322", "unit": "6", "topic": "", "text": "Write a Java program that takes a list of integers as input from the user and stores them in a PriorityQueue. The program should then remove and display the top three highest integers from the PriorityQueue.", "marks": 5.0, "type": "theory"}, {"sr_no": "323", "unit": "6", "topic": "", "text": "Sports tournament organizer: \nWrite a program that simulates a sports tournament using a PriorityQueue. The program should allow the user to input team names and their win-loss records. The program should then prioritize teams based on their win-loss records and add them to the PriorityQueue. When it's time for the next match, the program should remove the two highest priority teams from the PriorityQueue and display their names.", "marks": 5.0, "type": "theory"}, {"sr_no": "324", "unit": "6", "topic": "", "text": "Write a program that simulates a queue of customers at a coffee shop using an ArrayDeque. The program should allow the user to perform the following actions:\nAdd a new customer to the back of the queue\nServe the next customer in the queue (i.e. remove the customer from the front of the queue)\nView the current queue of customers\nThe program should continue to prompt the user for actions until they choose to quit.", "marks": 5.0, "type": "theory"}, {"sr_no": "325", "unit": "6", "topic": "", "text": "Music player playlist: Write a program that simulates a music player playlist using an ArrayDeque. The program should allow the user to add songs to the playlist, play the next or previous song in the playlist, and shuffle the playlist. The program should keep track of the songs in the playlist using an ArrayDeque, where each element in the deque represents a song. When the user adds a song, you can use the addLast method to add it to the end of the playlist. When the user plays the next or previous song, you can use the removeFirst or removeLast method, respectively, to remove the current song from the front or back of the deque and add it to the end or beginning of the deque. When the user shuffles the playlist, you can use the shuffle method to randomly reorder the songs in the deque.", "marks": 7.0, "type": "theory"}, {"sr_no": "326", "unit": "6", "topic": "", "text": "Make the system as User interactive and give choices to user. \nWeb browser history: Write a program that simulates a web browser history using an ArrayDeque. The program should allow the user to navigate back and forward through their history of visited web pages, similar to how a web browser works. The program should keep track of the URLs of visited web pages using an ArrayDeque, where each element in the deque represents a visited web page. When the user navigates to a new web page, you can push the URL onto the deque. When the user navigates back or forward, you can pop URLs off the front or back of the deque, respectively.", "marks": 5.0, "type": "theory"}, {"sr_no": "327", "unit": "6", "topic": "", "text": "In my restaurant I used to manage it well as per the order. I never want to skip any order from the customer. So I prepare a rule: When I get the order I add it in the last of my cook queue. And when the order is ready I used to pick it up from the first of the cook queue. \nSo, write a java program with class Restaurant. Create a queue cook which contains item names. Ask user weather he wants to Order or take food. If user press 1 then ask for the name of the item and it should be added in the cook queue. \nIf user press 2 then The first item from the queue should be removed from the queue. \nIf user press 3 then he can see the items of the queue. If user press 4 then he should move out from the Restaurant.", "marks": 6.0, "type": "theory"}, {"sr_no": "328", "unit": "6", "topic": "", "text": "Write  a java program that reads in a list of integers from the user and stores them in a HashSet. The program should then compute the sum of all unique integers in the HashSet and output the result to the user. If the user enters the same integer multiple times, it should only be counted once in the sum.", "marks": 4.0, "type": "theory"}, {"sr_no": "329", "unit": "6", "topic": "", "text": "Write a program that reads in a list of words from the user and stores them in a HashSet. The program should then prompt the user for a prefix and output all the words in the set that start with that prefix.", "marks": 4.0, "type": "theory"}, {"sr_no": "330", "unit": "6", "topic": "", "text": "Write a program that reads in a list of names and corresponding phone numbers from the user, and stores them in a HashMap. The program should then prompt the user for a name and output the corresponding phone number, or a message indicating that the name is not in the map.", "marks": 5.0, "type": "theory"}, {"sr_no": "331", "unit": "6", " he HashTable.\nkeySet(): Returns a Set of all keys in the HashTable. In this program, it should be used to print out a list of all words in the dictionary.", "marks": 5.0, "type": "theory"}, {"sr_no": "335", "unit": "6", "topic": "", "text": "Write a Java program that creates a HashTable to store information about books in a library. The HashTable should use the book titles as keys and store information about each book, such as the author, publisher, and year of publication. The program should provide the following functionality:\nAdd a book: The program should prompt the user for a book title, author, publisher, and year of publication, and add the book to the HashTable.\nRemove a book: The program should prompt the user for a book title and remove the corresponding entry from the HashTable.\nSearch for a book: The program should prompt the user for a book title and output the corresponding information stored in the HashTable, such as the author, publisher, and year of publication. If the book title is not found in the HashTable, the program should o\nList all books: The program should list all books in the HashTable, along with their corresponding information.To accomplish these tasks, you can use the following HashTable methods: put(key, value): Inserts a key-value pair into the HashTable.\nremove(key): Removes a key-value pair from the HashTable.\nget(key): Returns the value corresponding to a given key in the HashTable.\ncontainsKey(key): Returns true if the HashTable contains a given key.\nkeySet(): Returns a Set of all the keys in the HashTable.", "marks": 5.0, "type": "theory"}, {"sr_no": "366", "unit": "7", "topic": "", "text": "Write a java program which read source file and destination file name and copy the content of source file to destination file using InputeStream class.", "marks": 4.0, "type": "theory"}, {"sr_no": "367", "unit": "7", "topic": "", "text": "Write a java program which read numbers from number.txt file and store even number to even.txt implement an efficient and user-friendly system that can handle the following tasks:\n1. Storing Captain Information:\n   - The system should use a HashMap data structure to store captain information.\n\n   - Each captains details, including their name, age, and team affiliation, will be represented as a `Captain` object.\n   - The HashMap will use the captains name as the key and the corresponding `Captain` object as the value.\n   - The five captains are Rohit(32 years old, Team MI), Dhoni (39 years old, Team CSK), Virat (30 years old, Team RCB), Hardik (31 years old, Team GT), and Rishabh (29 years old, Team DC).\n\n2. Displaying Captain Details:\n   - Before the voting process begins, the system should display the details of all the captains to the user.\n   - The captain details should be printed on the console.\n\n3. Simulating the Voting Process:\n   - The voting process will involve 50 voters, each voter will be named Voter-1, Voter-2, and so on, and will randomly select one of the five captains.\n   - The random selection will be done using the Math.random() method.\n\n4. Recording the Voting Sequence:\n   - The system should record the voting sequence, indicating the voter name and the captain they voted for.\n   - The voting sequence should be stored in a ArrayDeque.\n\n5. Writing Initial Captain Details to File:\n   - The system should create a text file named \"Voting Result.txt\" to store the voting details.\n   - Before the voting process begins, the system should write the initial captain details (stored in the HashMap) to the file.\n\n   - The captain details should be written in a formatted manner for better readability.\n\n6. Writing Voting Sequence to File:\n   - After the voting process is complete, the system should update the \"Voting Result.txt\" file.\n   - The voting sequence, including the name of the voter and the captain they voted for, should be written to the file only.\n\n7. Counting Votes:\n   - The system should count the votes received by each captain.\n   - The vote count should be stored in a HashMap, where the captain's name is the key, and the vote count is the value.\n\n8. Sorting and Displaying Voting Results:\n   - The system should sort the captains based on the vote count in descending order.\n   - The sorted results should be displayed on the console, showing the number of votes and the percentage of votes gained for each captain.\n   - The system should also determine the winner, i.e., the captain with the highest number of votes.\n   - The winner's name, team affiliation, total votes, and percentage of votes received should be displayed on the console.\n\n9. Writing Final Voting Results to File:\n   - The system should update the \"Voting Result.txt\" file with the final voting results.\n   - The final voting results, including the number of votes and percentage of votes for each captain, and then the winner's details, should be written to the file.\n\n10. Error Handling:\n    - The system should handle any potential errors during file operations.\n\nOverall, the goal of the system is to provide an efficient and reliable platform for conducting the voting process and generating accurate voting results for the election of \"Best Captain (Viewers Choice)- IPL 2023\" winner that will be new captain for team India in upcoming WorldCup-2023.\n\nThanks for being an outstanding intern, and we are confident that your future holds tremendous success and achievement. Wishing you the very best in all your endeavors!", "marks": 1, "type": "theory"}, {"sr_no": "414", "unit": "6,7,8", "topic": "", "text": "You are tasked with implementing a basic Library Management System in Java, which allows users to manage books, register users, and handle borrowing and returning of books. The system should support storing information in files for persistence. The program consists of several classes and functionalities, as described below:\nClasses and Their Responsibilities:\n1.\tBook:\n•\tRepresents a book 7.\tExiting the System:\n•\tProvides an option to exit the system.", "marks": 1, "type": "theory"}, {"sr_no": "415", "unit": "6,7,8", "topic": "", "text": "Filename: ScienceFairVoting.java\nYou have been selected as a junior Java developer by the organizing committee of the National Science Fair 2025, tasked with creating a digital voting system for selecting the “Best Young Innovator – Viewers’ Choice Award”. The system will manage and simulate the voting process among five top student participants from different regions of India.\n\nEach participant (innovator) is associated with their name, age, and project title. A total of 30 audience members will cast votes, each randomly selecting one of the five participants.\n\nYour mission is to design and implement a Java-based system that can efficiently perform the following tasks:\n1. Storing Participant Information\n- The participant information (names, ages, and project titles) will be read from three separate text files (This text files are already available in in soft copy in Moodle software, Download and use it) :\n  - \"ParticipantsName.txt\"\n  - \"ParticipantsAge.txt\"\n  - \"ParticipantsTitle.txt\"\n- Each line in these files corresponds to a participant's name, age, and project title respectively.\n- The system should read these files and construct Participant objects using the corresponding entries.\n- Use a HashMap to store the Participant objects, where the key is the participant's name and the value is the corresponding `Participant` object.\n2. Displaying Participant Details\n- Before voting begins, the program should print all participant details on the console in a readable format.\n3. Writing Initial Participant Details to File\n- write the details of all participants to a file named \"VotingResults.txt\".\n- Format the participant information clearly for easy readability.\n4. Simulating the Voting Process\n-The 30 audience members' names are predefined in a file named \"VoterNames.txt\" (This text files are already available in in soft copy in Moodle software, Download and use it).\n-Each line in the file contains one voter’s full name.\n-Each voter will randomly vote for one of the five participants using Math.random().\n5. Recording the Voting Sequence\n-Use an ArrayDeque to record the voting sequence.\n-Each entry should contain the voter’s name and the participant they voted for.\n-Voter names should be read from the \"VoterNames.txt\".file.\n- After the voting simulation, voting sequence should be printed on consol. \n(Ex: Zalak Bhavsar voted for Aarya\n        Deep Patel voted for Shanvi ….. )\n6. Writing Voting Sequence to File\n- After the voting simulation, append the voting sequence to the \"VotingResults.txt\" file.\n7. Counting Votes\n- Use a HashMap to count how many votes each participant received.\n- The participant’s name will be the key and the vote count the value.\n8. Sorting and Displaying Voting Results\n- Sort participants by number of votes in descending order.\n- Print the sorted results on the console, showing:\n  - Participant name\n  - Total votes\n  - Percentage of total votes\n- Also display the winner’s details in console, including:\n  - Name\n  - Project Title\n  - Total votes\n  - Percentage of votes received\n9. Writing Final Voting Results to File\n- Append the sorted voting results and winner’s details to the \"VotingResults.txt\" file.\n10. Error Handling\n- Ensure all file operations are wrapped with appropriate try-catch blocks.\n- Handle any exceptions that may arise during file I/O operations.\nExpected Output in console and in \"VotingResults.txt\" should be: \nParticipants:\nName: Reet, Age: 21, Project: Disaster Rescue Drone\nName: Rudra, Age: 22, Project: AI-Powered Farming Bot\nName: Aarya, Age: 21, Project: Eco-Friendly Smart Home\nName: Shanvi, Age: 20, Project: Plastic to Fuel Converter\nName: Prisha, Age: 23, Project: Smart Water Purifier\n\nZalak Bhavsar voted for Reet\nDeep Patel voted for Rudra\nKrunal Patel "40": `// Multiple Interface Inheritance (CombinedOperation)
interface BaseOperation { double PI=3.14159; double calculate(double a, double b); }
interface AdditionOperation extends BaseOperation { double ADD_CONST=1.0; double add(double a, double b); }
interface MultiplicationOperation extends BaseOperation { double MUL_CONST=1.0; double multiply(double a, double b); }
interface CombinedOperation extends AdditionOperation, MultiplicationOperation { double COMBINED_CONST=100.0; double combined(double a, double b); }
class OperationExecutor implements CombinedOperation {
    public double calculate(double a, double b) { System.out.println("Base Constant: "+PI); return a+b; }
    public double add(double a, double b) { System.out.println("Add Constant: "+ADD_CONST); return a+b; }
    public double multiply(double a, double b) { System.out.println("Multiply Constant: "+MUL_CONST); return a*b; }
    public double combined(double a, double b) { System.out.println("Combined Constant: "+COMBINED_CONST); return (a+b)*(a*b); }
}
class Q40_MultipleInterfaceInheritance {
    public static void main(String[] args) {

            if(statusRef[i][j]==0) free++; else if(statusRef[i][j]==1) occ++; else inacc++;
        }

    }

        for(int i=0;i<3;i++) for(int j=0;j<3;j++) if(statusRef[i][j]==2) statusRef[i][j]=0;
        display();
    }

            }

"1": "Even though y is a Base variable, it actually holds a Derived object. Java checks at RUNTIME which version of Print() to call — so it picks Derived's version. That's called dynamic method dispatch: the real object decides, not the variable type.",

"11": "In Java, the keyword `abstract` is used before `class` to define an abstract class, like `abstract class MyClass { }`. It's a special word that tells Java \"this class is incomplete and can't be created directly.\" No other spelling like `abst` or `Abstract` works — only lowercase `abstract`.",
"12": "An abstract class does NOT need to have any abstract methods — you can have a fully concrete class marked as abstract and Java won't complain. Statements A and B are wrong because they say you MUST have abstract methods. It's like a recipe book: you can label it \"incomplete\" even if all recipes are done — you just can't cook from it directly.",
"13": "When you create a child object, Java first calls the parent constructor before the child constructor. So `new LJIET()` first runs LJU's constructor (prints \"Hi \") then LJIET's constructor (prints \"Bye\"). It's like building a house — you build the foundation (parent) first, then the rooms (child).",
"14": "You cannot create an object of an abstract class using `new`. `Fiction` is abstract, so `new Fiction()` gives a compiler error. Even though `BookStore` exists as a concrete subclass, you can only directly create objects of concrete (non-abstract) classes. Abstract classes are like templates — you can't print from a blank template.",
"15": "The variable `bs` has type `Fiction` but holds a `BookStore` object. When `bs.show()` is called, due to dynamic dispatch, BookStore's show runs and prints \"Book Store Print\". The actual object's method wins!",
"19": "Interface variables in Java are automatically `public static final`. That means they're accessible everywhere (public), belong to the class not objects (static), and can never be changed (final). Think of them like a magic number written on a billboard — everyone can see it, it's shared, and nobody can change it.",
"20": "Methods declared in an interface are automatically `public` and `abstract`. They have no body — just a name and parameters. `public` means anyone can use them, and `abstract` means the implementing class must write the actual code. It's like giving someone a to-do list: the list is public (everyone sees it), but it's abstract (you haven't done the work yet).",
"21": "When a class implements an interface method, it MUST use the `public` access modifier. This is because interface methods are `public` by default, and you can't reduce visibility when implementing. It's like if your teacher makes a public promise — you can't secretly break it.",
"22": "Java does not have \"full-fledged\" multiple inheritance (one class inheriting from two classes) because it causes the diamond problem. Abstract classes and interfaces give PARTIAL solutions, but they're not the same as true multiple class inheritance. It's like having two step-parents — you learn from both but you don't truly inherit everything from both.",
"23": "If Shape is an abstract class, you EXTEND it (not implement). Option B works because it extends Shape and provides the radius field. You can't use `implements` with a class, and you can't create a concrete class without implementing all abstract methods. Option B is the only one that properly extends the abstract class.",
"24": "The keyword `implements` is used when a class wants to follow an interface's contract. For example: `class Dog implements Animal`. `extends` is for classes, `instanceof` checks types at runtime. Only `implements` connects a class to an interface.",

"28": "The method `step2` returns a `float` value. In Java, if you write `return 2;` in a method that returns `float`, Java automatically converts it to `2.0`. The `println` then prints `2.0`. It's like putting a whole number into a decimal box — Java adds the `.0` for you.",

"30": "The class `ElectricBus` implements the `Bus` interface and provides the `move()` method which prints \"Implemented move() method.\" When you call `new ElectricBus().move()`, it runs the implemented method. Interfaces define WHAT to do, and implementing classes define HOW to do it.",
"31": "The variable `lj` has type `LJIET1` (abstract class) but holds an `FY` object. Due to dynamic method dispatch, when `lj.exam()` is called, Java runs FY's version of exam() which prints \"FY Exam\". The actual object's method is called, not the reference type's method.",

"33": "For `arr[0].cal(0)`: 0 < 2, so x = VAR = 0. For `arr[1].cal(1)`: 1 < 2, so x = VAR = 0. For `arr[2].cal(2)`: 2 is NOT < 2, so x = 2*2 = 4. Output: 0 0 4. Interface constants like VAR are static and final — they never change.",
