"110": "The base class for all exceptions is `Throwable`, not `Exception`. Throwable has two children: Exception (for recoverable errors) and Error (for serious JVM problems). Think of Throwable as the grandparent.",
"111": "NullPointerException, ArrayIndexOutOfBoundsException, ArithmeticException, and NumberFormatException are all UNCHECKED exceptions (they extend RuntimeException). The compiler doesn't force you to handle them.",
"112": "`Throwable` is the built-in base class used to handle all exceptions in Java. It sits at the top of the exception hierarchy. Both `Exception` and `Error` are subclasses of Throwable.",
"113": "The array `a` has size 5 (indices 0-4), but the code tries to access `a[10]`. Index 10 doesn't exist, so Java throws `ArrayIndexOutOfBoundsException`. It's like trying to sit in seat #10 on a bus that only has 5 seats.",
"114": "The keywords for exception handling are `try`, `catch`, and `finally`. The word `thrown` (past tense) is NOT a keyword — the correct keyword is `throw` (present tense). Java is very picky about spelling.",
"115": "A `try` block MUST be followed by either a `catch` block or a `finally` block (or both). Having a `try` alone with no `catch` or `finally` is illegal in Java.",
"116": "`catch` is the keyword used to handle exceptions thrown by a `try` block. `try` watches for errors, `catch` handles them, and `finally` runs cleanup code. You need `catch` to deal with the problem.",
"117": "`throw` is the keyword used to manually throw an exception. You write `throw new SomeException(\"message\");`. Only `throw` actually creates and launches an exception.",
"118": "A `try` block can have MANY `catch` blocks (to handle different exception types) but only ONE `finally` block. It's like having multiple doctors for different injuries but one exit door.",
"119": "`throw` is used to hand over your created exception object to the JVM. `throws` just declares that a method might throw — it doesn't actually throw anything. Only `throw` does the actual throwing.",
"120": "The statement `System.out.print(\"Hello\" + \" \" + 1 / 0)` tries to do `1/0` which throws ArithmeticException BEFORE printing. So only \"World\" gets printed from the catch block.",
"121": "`a = 5 / b` where b=0 throws ArithmeticException immediately — `System.out.print(\"A\")` never runs. The catch block prints \"B\", then finally prints \"C\". Output: BC.",
"122": "You can only throw objects that extend Throwable — primitives like `int` are NOT throwable. `throw 10` tries to throw a raw integer, which is not a Throwable. The compiler catches this and gives an error.",
"123": "The code prints \"1\", then enters try and prints \"2\", then finally runs and prints \"3\". Since no exception occurs, all three print statements execute in order. Output: 123.",
"124": "In Java, `finally` must come AFTER all catch blocks. Having `finally` before `catch` is a syntax error. The correct order is: try → catch → finally.",
"125": "No exception occurs in the try block, so the catch is skipped. The try prints \"1,\", finally prints \"8,\", and after try-finally the code prints \"9,\". Output: 1,8,9,.",
"126": "Both `a` and `b` are static int variables with default value 0. So `a1+b1/(a+b)` becomes `3+2/(0+0)` = `3+2/0`, which divides by zero → ArithmeticException. Output: \"Bye\".",
"127": "The catch block for Exception is listed BEFORE the catch for ArrayIndexOutOfBoundsException. Since Exception is the parent class, it catches EVERYTHING first. Java requires more specific catches BEFORE general ones. This gives a compile error.",
"128": "The string `s` is assigned the literal `\"null\"` (the word), not the null reference. So `s.length()` returns 4. The try prints \"n\", \"u\", \"l\", then prints 4, then finally prints \"l\". Output: nul4l.",
"129": "Variables `a` and `b` are declared but never initialized. In `a1+b1/(a+b)`, the denominator `a+b` uses uninitialized local variables. Java does NOT allow using uninitialized local variables — this is a compile error.",
"130": "The constructor `Test(String s) throws Exception` throws IOException. In main, the catch only handles ArithmeticException, not IOException. Since IOException is a checked exception and it's not caught, this causes a compile error.",
"131": "The code prints \"a \", then enters try printing \"b \". Inside, `10/0` throws ArithmeticException, so \"c \" is skipped. Inner catch tries `s.length()` on null → NullPointerException, so \"d \" is skipped. Inner finally prints \"e \". Outer catch catches NPE and prints \"g \". Outer finally prints \"h \". Then \"i \". Output: a b e g h i.",
"137": "Throwable has exactly two direct children: `Exception` (for recoverable errors you catch) and `Error` (for serious JVM problems you usually don't catch). Exception is for programming mistakes; Error is for system-level failures.",
"138": "When catching exceptions, Java checks catch blocks in ORDER from top to bottom. Since `Base` is the parent of `Derived`, catching `Base` first would catch Derived exceptions too. Java requires MORE SPECIFIC (child) exceptions to be caught BEFORE general (parent) ones. Having catch(Base) before catch(Derived) gives a compile error.",
"139": "The try creates an ArithmeticException with message \"Division \" and throws it. The catch catches Exception and prints the message: \"Division \". Then `System.out.println(\"/0\")` prints \"/0\". Output: Division /0."

  buildProgressNav();
  renderMCQ();
  updateScoreDisplay();
}

function buildUnitNav(){
  const nav = document.getElementById('unitNav');
  nav.innerHTML = `<button class="unit-btn ${unitFilter===''?'active':''}" onclick="setUnit('')">All Units</button>`;
  UNITS.forEach(u=>{
    nav.innerHTML += `<button class="unit-btn ${unitFilter===u?'active':''}" onclick="setUnit('${u}')">Unit ${u}</button>`;
  });
}
function setUnit(u){ unitFilter=u; document.getElementById('unitFilter').value=u; buildUnitNav(); applyFilters(); }
function applyFilters(){ unitFilter=document.getElementById('unitFilter').value; buildUnitNav(); if(section==='mcq') renderMCQ(); else renderTheory(); }

function buildProgressNav(){
  const nav = document.getElementById('progressNav');
  nav.innerHTML='';
  UNITS.forEach(u=>{
    const unitQs = ALL_QUESTIONS.filter(q=>q.unit===u);
    const done   = unitQs.filter((_,i)=>answered[ALL_QUESTIONS.indexOf(unitQs[i])]!==undefined).length;
    const pct    = unitQs.length ? Math.round(done/unitQs.length*100) : 0;
    nav.innerHTML+=`<div class="progress-ring"><span style="min-width:48px;font-size:.75rem">Unit ${u}</span>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span style="min-width:32px;text-align:right">${pct}%</span></div>`;
  });
}

// ── Render MCQ ────────────────────────────────────────────────────────────
function renderMCQ(){
  section='mcq';
  let qs = ALL_QUESTIONS;
  if(unitFilter) qs=qs.filter(q=>q.unit===unitFilter);
  const c = document.getElementById('mainContent');
  if(!qs.length){ c.innerHTML='<div class="empty">No MCQ questions for this filter.</div>'; return; }

  let html='';
  if(mode==='practice'){
    html+=`<div class="score-panel">
      <div><div class="score-big">${score.toFixed(1)}</div><div class="score-label">Score</div></div>
      <div><div class="score-big" style="font-size:1.8rem">${Object.keys(answered).length}/${ALL_QUESTIONS.length}</div><div class="score-label">Answered</div></div>
      <div><div class="score-big" style="font-size:1.8rem">${ALL_QUESTIONS.filter((_,i)=>answered[i]==='correct').length}</div><div class="score-label">Correct ✅</div></div>
      <button class="btn btn-outline btn-sm" onclick="resetProgress()" style="margin-left:auto;color:#fff;border-color:rgba(255,255,255,.4)">Reset</button>
    </div>`;
  }

  /* instructions shown below if present */

  qs.forEach((q,localIdx)=>{
    const globalIdx = ALL_QUESTIONS.indexOf(q);
    const isAnswered= answered[globalIdx]!==undefined;
    const userAns   = answered[globalIdx];
    const bm        = bookmarks.includes(globalIdx);
    html+=`<div class="q-card" id="qcard-${globalIdx}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span class="q-num">Q${q.sr_no || globalIdx+1}</span>
        <span class="marks-badge">${q.marks} mark${q.marks!==1?'s':''}</span>
        <span class="q-meta">Unit ${q.unit}</span>
        <button class="bookmark-btn ${bm?'bookmarked':''}" onclick="toggleBookmark(${globalIdx})" title="Bookmark">${bm?'🔖':'🏷️'}</button>
      </div>
      <div class="q-text">${escHtml(q.text)}</div>
      ${q.image?`<img class="q-image" src="${q.image}" alt="Question image"/>`:''}
      <div class="options">`;
    ['A','B','C','D'].forEach(letter=>{
      const optText = q.options[letter];
      if(!optText) return;
      let cls = 'opt';
      if(isAnswered && mode==='practice'){
        if(letter===q.answer) cls+=' correct';
        else if(letter===userAns) cls+=' wrong';
      }
      html+=`<div class="${cls}" id="opt-${globalIdx}-${letter}" onclick="selectAnswer(${globalIdx},'${letter}')">
        <span class="opt-label">${letter}</span>${escHtml(optText)}</div>`;
    });
    html+=`</div>`;
    if(isAnswered && mode==='practice'){
      const correct = userAns===q.answer;
      html+=`<div class="feedback ${correct?'correct':'wrong'}">${correct?'✅ Correct!':'❌ Wrong — Correct answer: '+q.answer+') '+escHtml(q.options[q.answer])}</div>`;
      const expl = getExplanation(q.sr_no);
      if(expl) html+=`<div class="explanation-box">💡 <b>ELI10:</b> ${escHtml(expl)}</div>`;
    } else if(mode==='reading'){
      html+=`<div class="feedback correct">✅ Answer: ${q.answer}) ${escHtml(q.options[q.answer])}</div>`;
      const expl = getExplanation(q.sr_no);
      if(expl) html+=`<div class="explanation-box">💡 <b>ELI10:</b> ${escHtml(expl)}</div>`;
    }
    html+=`</div>`;
  });
  c.innerHTML=html;
}

// ── Render Theory ─────────────────────────────────────────────────────────
function renderTheory(){
  section='theory';
  let th = ALL_THEORY;
  if(unitFilter) th=th.filter(t=>t.unit===unitFilter);
  const c = document.getElementById('mainContent');
  if(!th.length){ c.innerHTML='<div class="empty">No theory / programs for this filter.</div>'; return; }
  let html=`<div class="instructions-box">📋 These are theory / programming questions from the practice book. Click "Show Solution ▼" to reveal Java code.</div>`;
  th.forEach((t,i)=>{
    const solId = 'sol-'+t.sr_no;
    html+=`<div class="theory-card">
      <h4>Unit ${t.unit} — Q${t.sr_no||i+1} &nbsp;<span class="marks-badge">${t.marks} marks</span></h4>
      <div class="q-text">${escHtml(t.text)}</div>
      ${t.image?`<img class="q-image" src="${t.image}" alt="Question image"/>`:''}
      ${t.solution?`<div class="solution-box">
        <div class="solution-header" onclick="toggleSolution('${solId}')">💻 Show Solution <span id="arrow-${solId}">▼</span></div>
        <div class="solution-body" id="${solId}"><pre><code>${escHtml(t.solution)}</code></pre></div>
      </div>`:''}
    </div>`;
  });
  c.innerHTML=html;
}
function toggleSolution(id){
  const el = document.getElementById(id);
  const arrow = document.getElementById('arrow-'+id.split('-')[1]);
  if(!el) return;
  el.classList.toggle('open');
  const hdr = el.previousElementSibling;
  if(el.classList.contains('open')){
    hdr.innerHTML = '💻 Hide Solution <span id="arrow-'+id.split('-')[1]+'">▲</span>';
  } else {
    hdr.innerHTML = '💻 Show Solution <span id="arrow-'+id.split('-')[1]+'">▼</span>';
  }
}

// ── Interactions ──────────────────────────────────────────────────────────
function selectAnswer(globalIdx, letter){
  if(mode==='reading') return;
  if(answered[globalIdx]!==undefined) return;
  const q = ALL_QUESTIONS[globalIdx];
  const correct = letter===q.answer;
  answered[globalIdx] = letter;
  if(correct) score+=q.marks;
  localStorage.setItem('answered', JSON.stringify(answered));
  localStorage.setItem('score',    score.toString());
  updateScoreDisplay();
  buildProgressNav();
  // Re-render only affected card
  renderMCQ();
}

function toggleMode(){
  mode = mode==='practice'?'reading':'practice';
  document.getElementById('btnMode').textContent = mode==='practice'?'🧪 Practice Mode':'📖 Reading Mode';
  if(section==='mcq') renderMCQ();
}

function showSection(s){
  if(s==='mcq')  renderMCQ();
  else           renderTheory();
}

function showBookmarks(){
  const c = document.getElementById('mainContent');
  const bqs = ALL_QUESTIONS.filter((_,i)=>bookmarks.includes(i));
  if(!bqs.length){c.innerHTML='<div class="empty">No bookmarks yet. Click 🏷️ on a question to bookmark it.</div>';return;}
  section='mcq';
  const backup=unitFilter; unitFilter='';
  // temp filter to only bookmarked
  const origQs=[...ALL_QUESTIONS];
  // render normally but only bookmarked
  let html='<h3 style="margin-bottom:16px;color:var(--warn)">🔖 Bookmarked Questions</h3>';
  bqs.forEach(q=>{
    const i=ALL_QUESTIONS.indexOf(q);
    html+=`<div class="q-card"><div class="q-meta">Q${i+1} · Unit ${q.unit} · ${q.marks} marks</div>
      <div class="q-text">${escHtml(q.text)}</div>
      ${q.image?`<img class="q-image" src="${q.image}" alt="Question image"/>`:''}
      ${['A','B','C','D'].map(l=>q.options[l]?`<div class="opt ${l===q.answer&&mode==='reading'?'correct':''}"><span class="opt-label">${l}</span>${escHtml(q.options[l])}</div>`:'').join('')}
      ${mode==='reading'?`<div class="feedback correct">✅ ${q.answer}) ${escHtml(q.options[q.answer])}</div>`:''}
    </div>`;
  });
  c.innerHTML=html;
  unitFilter=backup;
}

function toggleBookmark(idx){
  const pos=bookmarks.indexOf(idx);
  if(pos===-1) bookmarks.push(idx);
  else bookmarks.splice(pos,1);
  localStorage.setItem('bookmarks',JSON.stringify(bookmarks));
  if(section==='mcq') renderMCQ();
}

function resetProgress(){
  if(!confirm('Reset all your progress?')) return;
  answered={}; score=0;
  localStorage.removeItem('answered');
  localStorage.removeItem('score');
  updateScoreDisplay(); buildProgressNav(); renderMCQ();
}

function updateScoreDisplay(){
  const pct = totalPossible>0 ? Math.round(score/totalPossible*100) : 0;
  document.getElementById('scoreDisplay').textContent = `Score: ${score.toFixed(1)} / ${totalPossible} (${pct}%)`;
}

function toggleTheme(){
  document.body.classList.toggle('light');
  const btn = document.querySelector('.btn-sm');
  btn.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
